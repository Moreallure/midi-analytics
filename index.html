<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="//unpkg.com/layui@2.9.9/dist/css/layui.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href= "style.css">

    <title>MIDI Analytics</title>

</head>

<body>

    <div id="settings">

        <!-- <div>

            <h2>Recording Data to:</h3>

            <div class="layui-form">
                <input type="checkbox" title="Total" lay-skin="tag" checked>
                <input type="checkbox" title="Monthly" lay-skin="tag" checked>
                <input type="checkbox" title="Daily" lay-skin="tag" checked>
                <input type="checkbox" title="Custom" lay-skin="tag">
            </div>

        </div> -->

        <div>

            <h2>Displaying Data:</h3>

            <div class="layui-form">
                <select>
                    <option value="Total">All</option>
                    <option value="Monthly">This Month</option>
                    <option value="Daily">Today</option>
                    <option value="Temporarily">Just Played</option>
                </select>
              </div>

        </div>

        <div>

            <h2>Accessories:</h2>

            <div class="layui-form">
                <input type="checkbox" title="Notes" checked>
                <input type="checkbox" title="Key" checked>
                <input type="checkbox" title="Pedal" checked>
            </div>

        </div>

        <div>

            <div class="layui-form">
                <button class="layui-btn layui-btn-primary layui-border-red">Erase All Data</button>
              </div>

        </div>

        <div>

            <h2>MIDI Device:</h2>

            <select id="midiDevice">
                <option value="">None</option>
            </select>

        </div>

        <div>

            <div id="good">

                <svg fill="#16b777" height="30px" width="30px" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.82 13.030l-1.002-1.002c-0.185-0.185-0.484-0.185-0.668 0l-6.014 6.013-2.859-2.882c-0.186-0.185-0.484-0.185-0.67 0l-1.002 1.003c-0.185 0.185-0.185 0.484 0 0.668l4.193 4.223c0.185 0.184 0.484 0.184 0.668 0l7.354-7.354c0.186-0.185 0.186-0.484 0-0.669zM16 3c-7.18 0-13 5.82-13 13s5.82 13 13 13 13-5.82 13-13-5.82-13-13-13zM16 26c-5.522 0-10-4.478-10-10 0-5.523 4.478-10 10-10 5.523 0 10 4.477 10 10 0 5.522-4.477 10-10 10z"></path>
                </svg>

                <p>"PIANO" Connected</p>

            </div>

            <div id="bad">

                <svg height="30px" width="30px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#ffb800" stroke-width="2"/>
                    <path d="M12 8L12 13" stroke="#ffb800" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 16V15.9888" stroke="#ffb800" stroke-width="2" stroke-linecap="round"/>
                </svg>

                <p>No MIDI device found,</p>

                <a href="">retry</a>

            </div>

        </div>

        <div class="help">

            <a href="javascript:" id="help">

                <svg fill="#16b777" height="27px" width="27px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zM7.92 9.234v.102a.5.5 0 0 0 .5.5h.997a.499.499 0 0 0 .499-.499c0-1.29.998-1.979 2.34-1.979 1.308 0 2.168.689 2.168 1.67 0 .928-.482 1.359-1.686 1.91l-.344.154C11.379 11.54 11 12.21 11 13.381v.119a.5.5 0 0 0 .5.5h.997a.499.499 0 0 0 .499-.499c0-.516.138-.723.55-.912l.345-.155c1.445-.654 2.529-1.514 2.529-3.39v-.103c0-1.978-1.72-3.441-4.164-3.441-2.478 0-4.336 1.428-4.336 3.734zm2.58 7.757c0 .867.659 1.509 1.491 1.509.85 0 1.509-.642 1.509-1.509 0-.867-.659-1.491-1.509-1.491-.832 0-1.491.624-1.491 1.491z"/>
                </svg>

                <p>Help</p>

            </a>

        </div>

    </div>

    <div id="main">

        <div id="chart"></div>

        <div id="info">
            <span>Notes</span>
            <p id="notes">0</p>
            <span>Key</span>
            <p id="key">_</p>
            <span>Pedal</span>
            <p id="pedal"></p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/webmidi@latest/dist/iife/webmidi.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js" integrity="sha512-d35gaU1E+gZdyLbQUGODiOEXqH+Q4pj9BmkFS3xwTrmw7DustRm+tfpfVQaywn9l+qCsd5dsJ4A+11s/OisvFw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="//unpkg.com/layui@2.9.9/dist/layui.js"></script>

    <script src="script.js"></script>

</body>

</html>
